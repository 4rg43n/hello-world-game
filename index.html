<style>

<body>
<canvas id="game"></canvas>
<div id="hud"><div id="stats">NULLRELAY_091 | HEALTH 100 | KILLS 0</div><div id="wave">SIGNAL: SEARCHING</div></div>
<div id="controls">

</div>

<script>
'use strict';
const canvas=document.getElementById('game'),screen=canvas.getContext('2d',{alpha:false});
const W=320,H=200,buffer=document.createElement('canvas');buffer.width=W;buffer.height=H;
const ctx=buffer.getContext('2d',{willReadFrequently:true});
const map=[
'1111111111111111','1000000000000001','1011100111000001','1000100001000001',
'1000100001002201','1000000000002001','1000000000002001','1000111000000001',
'1000100000111001','1000100000100001','1000000000100001','1000000000000001',
'1000330000000001','1000030000000001','1000000000000001','1111111111111111'];
const MW=map[0].length,MH=map.length;
function wall(x,y){if(x<0||y<0||x>=MW||y>=MH)return 1;return Number(map[y][x]);}
function solid(x,y,r=.2){return !!(wall(Math.floor(x-r),Math.floor(y-r))||wall(Math.floor(x+r),Math.floor(y-r))||wall(Math.floor(x-r),Math.floor(y+r))||wall(Math.floor(x+r),Math.floor(y+r)));}
function makeTexture(type){const c=document.createElement('canvas');c.width=c.height=64;const t=c.getContext('2d');t.imageSmoothingEnabled=false;
const palettes={1:['#171f2c','#303b4c','#566173','#0a111b','#25a5a9'],2:['#101f2d','#263e50','#46687a','#07131d','#43d5e2'],3:['#291d2b','#554052','#815563','#170f20','#d34ba9']};
const [dark,base,edge,black,glow]=palettes[type];t.fillStyle=dark;t.fillRect(0,0,64,64);
const r=(x,y,w,h,color)=>{t.fillStyle=color;t.fillRect(x,y,w,h)};
for(let row=0;row<2;row++)for(let col=0;col<2;col++){let x=col*32,y=row*32;r(x+1,y+1,30,30,black);r(x+3,y+3,26,26,base);r(x+3,y+3,26,2,edge);r(x+3,y+27,26,2,dark);r(x+5,y+5,2,2,edge);r(x+25,y+25,2,2,edge);
if((row+col+type)%2===0){r(x+9,y+8,14,3,black);r(x+10,y+9,12,1,glow);r(x+9,y+14,14,9,dark);for(let k=0;k<4;k++)r(x+11+k*3,y+16,2,4,edge);}
else{r(x+9,y+8,14,15,dark);r(x+11,y+10,10,11,black);r(x+12,y+12,8,2,glow);r(x+12,y+17,5,1,edge);}}
if(type===3){r(42,5,8,54,'#492336');r(44,5,3,54,'#a05c70');r(38,30,18,5,'#733d51');r(40,42,16,4,'#bd6377');}
let seed=type*91237;const rand=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296);for(let i=0;i<240;i++){r(Math.floor(rand()*64),Math.floor(rand()*64),1,1,rand()>.5?'#ffffff18':'#00000030');}
return t.getImageData(0,0,64,64).data;}
const textures=[null,makeTexture(1),makeTexture(2),makeTexture(3)];
// Reclaimed: corrupted station personnel fused with security hardware.
function makeGuard(){const c=document.createElement('canvas');c.width=32;c.height=64;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
const r=(color,x,y,w,h)=>{g.fillStyle=color;g.fillRect(x,y,w,h)};
r('#12151d',8,49,7,15);r('#14151a',19,48,8,16);r('#6b4d4c',9,48,6,9);r('#374452',20,49,7,10);
r('#2c323c',6,25,23,27);r('#724d52',9,27,14,24);r('#a97773',11,28,9,19);r('#26323b',21,26,8,26);
r('#151e28',5,22,11,11);r('#6c7882',5,23,9,6);r('#9d6868',17,24,10,7);
r('#af7c74',2,30,5,18);r('#6c4c51',3,45,4,9);r('#28333d',26,30,5,17);r('#667786',27,35,4,10);
r('#b78b7f',10,9,14,17);r('#74585a',10,9,14,5);r('#343a45',8,7,18,8);r('#77838a',9,7,16,4);
r('#33202a',11,15,12,7);r('#e148b4',18,16,5,4);r('#ffd2ec',20,17,2,2);r('#2b1b27',12,18,3,3);
r('#714249',13,24,8,4);r('#d09b8a',12,29,4,8);r('#412b39',17,32,3,12);
r('#161d26',8,35,3,11);r('#d74d86',9,36,2,5);r('#566773',23,38,3,10);
return g.getImageData(0,0,32,64).data;}

// Perspective-correct 64x64 floor and ceiling tiles (one world unit per tile).
function makeSurface(ceiling){const c=document.createElement('canvas');c.width=c.height=64;const t=c.getContext('2d');const r=(color,x,y,w,h)=>{t.fillStyle=color;t.fillRect(x,y,w,h)};
r(ceiling?'#111b29':'#17232d',0,0,64,64);
r('#090f18',0,0,64,3);r('#090f18',0,0,3,64);r('#394a58',4,4,56,56);r(ceiling?'#263747':'#283844',6,6,52,52);
r('#0c1720',8,8,48,48);r(ceiling?'#253847':'#344753',11,11,42,42);
r('#536572',11,11,42,2);r('#17222c',11,51,42,2);
for(const p of [[6,6],[54,6],[6,54],[54,54]])r('#8b9da1',p[0],p[1],3,3);
if(ceiling){r('#0b1d2a',19,18,26,28);r('#2c5663',21,20,22,24);r('#44c3ca',23,22,18,20);r('#a2e4dc',26,25,12,14);r('#1c4352',23,41,18,3);}
else{r('#101c25',18,18,28,28);for(let i=0;i<5;i++){r('#536977',20+i*5,20,2,24);r('#152630',20,22+i*5,24,2);}r('#2d8995',28,7,8,2);r('#225762',28,55,8,2);}
return t.getImageData(0,0,64,64).data;}
const floorPixels=makeSurface(false),ceilingPixels=makeSurface(true);
function drawSurfaces(pixels,dirX,dirY,planeX,planeY){
const leftX=dirX-planeX,leftY=dirY-planeY,rightX=dirX+planeX,rightY=dirY+planeY;
for(let y=0;y<H;y++){const offset=y-H/2;if(!offset)continue;
const floor=offset>0,depth=(H*.5)/Math.abs(offset),stepX=depth*(rightX-leftX)/W,stepY=depth*(rightY-leftY)/W;
let wx=player.x+depth*leftX,wy=player.y+depth*leftY;const tex=floor?floorPixels:ceilingPixels;
const shade=Math.max(.35,Math.min(.95,1.1-depth*.075));
for(let x=0;x<W;x++){const tx=((Math.floor((wx-Math.floor(wx))*64))&63),ty=((Math.floor((wy-Math.floor(wy))*64))&63),src=(ty*64+tx)*4,dst=(y*W+x)*4;
pixels[dst]=tex[src]*shade;pixels[dst+1]=tex[src+1]*shade;pixels[dst+2]=tex[src+2]*shade;pixels[dst+3]=255;wx+=stepX;wy+=stepY;}
}}

const guardPixels=makeGuard(),zBuffer=new Float32Array(W);
const player={x:3.5,y:5.5,angle:0,health:100};
let enemy=null,kills=0,spawnAt=0,gameOver=false,flashUntil=0,damageFlashUntil=0,lastShot=0,lastEnemyAttack=0;
const keys=new Set(),activePointers=new Map(),keyboardHeld=new Set();
const bindings={forward:'forward',back:'back',left:'left',right:'right',turnLeft:'turnLeft',turnRight:'turnRight',fire:'fire'};
function syncKeys(){keys.clear();for(const action of activePointers.values())keys.add(action);for(const action of keyboardHeld)keys.add(action);}
for(const [id,action] of Object.entries(bindings)){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);activePointers.set(e.pointerId,action);b.classList.add('pressed');syncKeys();});function release(e){activePointers.delete(e.pointerId);b.classList.remove('pressed');syncKeys();}b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',release);}
const keyMap={KeyW:'forward',ArrowUp:'forward',KeyS:'back',ArrowDown:'back',KeyA:'left',KeyD:'right',ArrowLeft:'turnLeft',ArrowRight:'turnRight',KeyQ:'turnLeft',KeyE:'turnRight',Space:'fire'};
window.addEventListener('keydown',e=>{const action=keyMap[e.code];if(action){e.preventDefault();keyboardHeld.add(action);syncKeys();}});
window.addEventListener('keyup',e=>{const action=keyMap[e.code];if(action){keyboardHeld.delete(action);syncKeys();}});
window.addEventListener('blur',()=>{activePointers.clear();keyboardHeld.clear();syncKeys();document.querySelectorAll('button').forEach(b=>b.classList.remove('pressed'));});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);screen.imageSmoothingEnabled=false;}window.addEventListener('resize',resize);resize();
// Ray distance to first wall along a unit direction.
function rayDistance(px,py,dx,dy,maxDistance=30){let mx=Math.floor(px),my=Math.floor(py);const deltaX=dx===0?1e30:Math.abs(1/dx),deltaY=dy===0?1e30:Math.abs(1/dy),stepX=dx<0?-1:1,stepY=dy<0?-1:1;let sx=(dx<0?px-mx:mx+1-px)*deltaX,sy=(dy<0?py-my:my+1-py)*deltaY,side=0;
for(let i=0;i<64;i++){if(sx<sy){sx+=deltaX;mx+=stepX;side=0;}else{sy+=deltaY;my+=stepY;side=1;}const dist=side===0?sx-deltaX:sy-deltaY;if(dist>maxDistance)return {distance:maxDistance,hit:0};const hit=wall(mx,my);if(hit)return {distance:Math.max(.001,dist),hit,side,wallX:((side===0?py+dist*dy:px+dist*dx)%1+1)%1,dx,dy};}
return {distance:maxDistance,hit:0};}
function visible(ax,ay,bx,by){const dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy);return rayDistance(ax,ay,dx/d,dy/d,d).distance>=d-.15;}
const corners=[[1.5,1.5],[14.5,1.5],[1.5,14.5],[14.5,14.5]];
function spawnEnemy(){const choices=corners.filter(([x,y])=>!solid(x,y,.22)&&Math.hypot(x-player.x,y-player.y)>3);const pool=choices.length?choices:corners.filter(([x,y])=>!solid(x,y,.22));if(!pool.length)return;const [x,y]=pool[Math.floor(Math.random()*pool.length)];enemy={x,y,health:2};spawnAt=0;}
function reset(){player.x=3.5;player.y=5.5;player.angle=0;player.health=100;kills=0;enemy=null;gameOver=false;spawnAt=0;flashUntil=0;damageFlashUntil=0;lastShot=0;lastEnemyAttack=0;activePointers.clear();keyboardHeld.clear();syncKeys();document.getElementById('gameover').style.display='none';spawnEnemy();}
document.getElementById('restart').addEventListener('click',reset);
function die(){gameOver=true;player.health=0;document.getElementById('finalScore').textContent='Enemies killed: '+kills;document.getElementById('gameover').style.display='flex';}
function shoot(now){if(gameOver||now-lastShot<300)return;lastShot=now;flashUntil=now+110;if(!enemy)return;const dx=enemy.x-player.x,dy=enemy.y-player.y,dist=Math.hypot(dx,dy),angle=Math.atan2(dy,dx)-player.angle,aim=Math.atan2(Math.sin(angle),Math.cos(angle));if(Math.abs(aim)<Math.atan2(.32,dist)&&visible(player.x,player.y,enemy.x,enemy.y)){enemy.health--;if(enemy.health<=0){enemy=null;kills++;spawnAt=now+5000;}}}
function update(dt,now){if(gameOver)return;
if(keys.has('turnLeft'))player.angle-=2.3*dt;if(keys.has('turnRight'))player.angle+=2.3*dt;
const dx=Math.cos(player.angle),dy=Math.sin(player.angle),sx=-dy,sy=dx;let mx=0,my=0;
if(keys.has('forward')){mx+=dx;my+=dy;}if(keys.has('back')){mx-=dx;my-=dy;}if(keys.has('left')){mx-=sx;my-=sy;}if(keys.has('right')){mx+=sx;my+=sy;}
const len=Math.hypot(mx,my);if(len){const vx=mx/len*2.8*dt,vy=my/len*2.8*dt;if(!solid(player.x+vx,player.y))player.x+=vx;if(!solid(player.x,player.y+vy))player.y+=vy;}
if(keys.has('fire'))shoot(now);
if(!enemy&&spawnAt&&now>=spawnAt)spawnEnemy();
if(enemy){const ex=player.x-enemy.x,ey=player.y-enemy.y,d=Math.hypot(ex,ey);if(d>0.8){const speed=1.05*dt;if(!solid(enemy.x+ex/d*speed,enemy.y,.23))enemy.x+=ex/d*speed;if(!solid(enemy.x,enemy.y+ey/d*speed,.23))enemy.y+=ey/d*speed;}
if(d<1.25&&visible(enemy.x,enemy.y,player.x,player.y)&&now-lastEnemyAttack>900){lastEnemyAttack=now;player.health=Math.max(0,player.health-10);damageFlashUntil=now+180;if(player.health<=0)die();}}
}
function render(now){const image=ctx.createImageData(W,H),pixels=image.data;
const dirX=Math.cos(player.angle),dirY=Math.sin(player.angle),planeX=-dirY*.66,planeY=dirX*.66;
drawSurfaces(pixels,dirX,dirY,planeX,planeY);
for(let x=0;x<W;x++){const cameraX=2*x/W-1,rayX=dirX+planeX*cameraX,rayY=dirY+planeY*cameraX;const hit=rayDistance(player.x,player.y,rayX,rayY);if(!hit.hit){zBuffer[x]=30;continue;}const distance=hit.distance;zBuffer[x]=distance;const lineHeight=Math.floor(H/distance),start=Math.max(0,Math.floor((H-lineHeight)/2)),end=Math.min(H,Math.floor((H+lineHeight)/2));let texX=Math.floor(hit.wallX*64);if((hit.side===0&&rayX>0)||(hit.side===1&&rayY<0))texX=63-texX;const texture=textures[hit.hit]||textures[1],shade=Math.max(.25,Math.min(1,1.15-distance*.075))*(hit.side===1?.75:1);
for(let y=start;y<end;y++){const texY=Math.floor(((y-H/2+lineHeight/2)/lineHeight)*64)&63,src=(texY*64+texX)*4,dst=(y*W+x)*4;pixels[dst]=texture[src]*shade;pixels[dst+1]=texture[src+1]*shade;pixels[dst+2]=texture[src+2]*shade;pixels[dst+3]=255;}}
// Enemy billboard with wall-depth occlusion.
if(enemy){const spriteX=enemy.x-player.x,spriteY=enemy.y-player.y,invDet=1/(planeX*dirY-dirX*planeY),transformX=invDet*(dirY*spriteX-dirX*spriteY),transformY=invDet*(-planeY*spriteX+planeX*spriteY);
if(transformY>.1){const spriteScreenX=Math.floor(W/2*(1+transformX/transformY)),spriteHeight=Math.abs(Math.floor(H/transformY)),spriteWidth=Math.floor(spriteHeight*.5),startY=Math.floor(H/2-spriteHeight/2),startX=Math.floor(spriteScreenX-spriteWidth/2),endX=startX+spriteWidth;
for(let stripe=Math.max(0,startX);stripe<Math.min(W,endX);stripe++){if(transformY>=zBuffer[stripe]||spriteWidth<=0)continue;const tx=Math.floor((stripe-startX)/spriteWidth*32);for(let y=Math.max(0,startY);y<Math.min(H,startY+spriteHeight);y++){const ty=Math.floor((y-startY)/spriteHeight*64);if(tx<0||tx>=32||ty<0||ty>=64)continue;const src=(ty*32+tx)*4;if(!guardPixels[src+3])continue;const dst=(y*W+stripe)*4,shade=Math.max(.4,1-transformY*.035);pixels[dst]=guardPixels[src]*shade;pixels[dst+1]=guardPixels[src+1]*shade;pixels[dst+2]=guardPixels[src+2]*shade;pixels[dst+3]=255;}}}}
ctx.putImageData(image,0,0);
// Weapon and muzzle flash.
ctx.fillStyle='#18191d';ctx.fillRect(143,171,34,29);ctx.fillStyle='#555961';ctx.fillRect(151,151,18,37);ctx.fillStyle='#92969c';ctx.fillRect(156,143,8,34);ctx.fillStyle='#302923';ctx.fillRect(148,185,24,15);
if(now<flashUntil){ctx.fillStyle='#fff1a1';ctx.fillRect(154,123,12,22);ctx.fillRect(146,130,28,8);ctx.fillStyle='#ffad22';ctx.fillRect(157,128,6,15);}
ctx.strokeStyle='#e6dfbb';ctx.beginPath();ctx.moveTo(155,100);ctx.lineTo(159,100);ctx.moveTo(161,100);ctx.lineTo(165,100);ctx.moveTo(160,95);ctx.lineTo(160,98);ctx.moveTo(160,102);ctx.lineTo(160,105);ctx.stroke();
// Minimap.
const scale=5,ox=5,oy=5;ctx.fillStyle='#000a';ctx.fillRect(ox-2,oy-2,MW*scale+4,MH*scale+4);for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){ctx.fillStyle=wall(x,y)?'#a5a9b1':'#26354b';ctx.fillRect(ox+x*scale,oy+y*scale,scale-1,scale-1);}if(enemy){ctx.fillStyle='#e148b4';ctx.fillRect(ox+enemy.x*scale-2,oy+enemy.y*scale-2,4,4);}ctx.fillStyle='#45d5df';ctx.fillRect(ox+player.x*scale-2,oy+player.y*scale-2,4,4);ctx.strokeStyle='#45d5df';ctx.beginPath();ctx.moveTo(ox+player.x*scale,oy+player.y*scale);ctx.lineTo(ox+(player.x+Math.cos(player.angle)*2)*scale,oy+(player.y+Math.sin(player.angle)*2)*scale);ctx.stroke();
if(now<damageFlashUntil){ctx.fillStyle='#ff00004d';ctx.fillRect(0,0,W,H);}
screen.imageSmoothingEnabled=false;screen.drawImage(buffer,0,0,canvas.width,canvas.height);
document.getElementById('stats').textContent='NULLRELAY_091 | HEALTH '+player.health+' | KILLS '+kills;
document.getElementById('wave').textContent=enemy?'RECLAIMED DETECTED':spawnAt?'NEXT SIGNAL IN '+Math.max(0,Math.ceil((spawnAt-now)/1000))+'s':'SIGNAL: SEARCHING';
}
let previous=performance.now();function loop(now){const dt=Math.min((now-previous)/1000,.05);previous=now;update(dt,now);render(now);requestAnimationFrame(loop);}reset();requestAnimationFrame(loop);
</script>
