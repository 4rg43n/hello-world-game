
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 maximum-scale=1, user-scalable=no">
  <title>Hello World Game</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      background: #151c2c;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    canvas {
      display: block;
      background: #263650;
      width: 95%;
      max-width: 500px;
      margin: 20px auto;
      border: 1px solid #526681;
      border-radius: 8px;

      /* Prevent Safari touch gestures */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>

<body>
  <h1>Hello World!</h1>
  <p>Drag the blue square around.</p>

  <canvas id="game" width="500" height="300"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const player = {
      x: 220,
      y: 130,
      size: 30
    };

    let activePointer = null;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
      );
    }

    function movePlayer(e) {
      const rect = canvas.getBoundingClientRect();

      const x = (e.clientX - rect.left) *
                canvas.width / rect.width;

      const y = (e.clientY - rect.top) *
                canvas.height / rect.height;

      player.x = Math.max(
        0,
        Math.min(canvas.width - player.size,
                 x - player.size / 2)
      );

      player.y = Math.max(
        0,
        Math.min(canvas.height - player.size,
                 y - player.size / 2)
      );

      draw();
    }

    canvas.addEventListener("pointerdown", e => {
      if (activePointer !== null) return;

      activePointer = e.pointerId;
      canvas.setPointerCapture(e.pointerId);
      movePlayer(e);
    });

    canvas.addEventListener("pointermove", e => {
      if (e.pointerId === activePointer) {
        movePlayer(e);
      }
    });

    function stopDragging(e) {
      if (e.pointerId === activePointer) {
        activePointer = null;
      }
    }

    canvas.addEventListener("pointerup", stopDragging);
    canvas.addEventListener("pointercancel", stopDragging);
    canvas.addEventListener("lostpointercapture", stopDragging);

    // Prevent touch scrolling inside the canvas.
    canvas.addEventListener("touchmove", e => {
      e.preventDefault();
    }, { passive: false });

    draw();
  </script>
</body>
</html>
